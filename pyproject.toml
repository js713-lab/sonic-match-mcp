[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicmatch-mcp"
version = "0.2.0"
description = "MCP server: video/URL in → scene/mood/pace analysis → license-safe BGM shortlist + mix preview."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "js713-lab" }]
keywords = [
    "mcp",
    "music",
    "bgm",
    "video",
    "ffmpeg",
    "instagram",
    "reels",
    "royalty-free",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]
local-vl = [
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "librosa>=0.10",
    "numpy>=1.26",
]
embeddings = ["lancedb>=0.13"]
all = [
    "sonicmatch-mcp[gemini,local-vl,embeddings]",
]

[project.scripts]
sonicmatch-mcp = "sonicmatch.server:main"

[project.urls]
Homepage = "https://github.com/js713-lab/sonic-match-mcp"
Repository = "https://github.com/js713-lab/sonic-match-mcp"
Issues = "https://github.com/js713-lab/sonic-match-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonicmatch = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
