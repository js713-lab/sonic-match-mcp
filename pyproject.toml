[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicmatch-mcp"
version = "0.2.1"
description = "Pick BGM that doesn't fight the voiceover. Watches the video, returns a hook + ffmpeg ducking spec, prints the license."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "js713-lab" }]
keywords = [
    "mcp",
    "music",
    "bgm",
    "video",
    "ffmpeg",
    "instagram",
    "reels",
    "royalty-free",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
gemini = ["google-genai>=1.0"]
local-vl = [
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "librosa>=0.10",
    "numpy>=1.26",
]
embeddings = ["lancedb>=0.13"]
all = [
    "sonicmatch-mcp[gemini,local-vl,embeddings]",
]

[project.scripts]
sonicmatch-mcp = "sonicmatch.server:main"

[project.urls]
Homepage = "https://github.com/js713-lab/sonic-match-mcp"
Repository = "https://github.com/js713-lab/sonic-match-mcp"
Issues = "https://github.com/js713-lab/sonic-match-mcp/issues"
Changelog = "https://github.com/js713-lab/sonic-match-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/js713-lab/sonic-match-mcp#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonicmatch = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors that catch real bugs, and a few warnings.
# Import sorting and format checks stay out so CI does not churn style.
select = ["E4", "E7", "E9", "F", "W"]
