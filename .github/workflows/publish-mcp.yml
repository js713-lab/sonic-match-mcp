name: Publish to MCP Registry

# Manual. Publishes server.json for an existing git tag. PyPI upload lives in
# release.yml so a registry publish cannot mint a package by accident.
# This workflow does not rewrite server.json. Bump manifest.json, server.json,
# and the MCPB checksum first. See PUBLISH.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require tag, server.json, and manifest.json to match
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG_NAME"].strip()
          if not tag.startswith("v"):
              raise SystemExit(f"tag {tag!r} must look like vX.Y.Z")
          version = tag[1:]
          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          if server.get("version") != version or manifest.get("version") != version:
              raise SystemExit(
                  "refusing to publish: tag "
                  f"{version!r}, server.json {server.get('version')!r}, "
                  f"manifest.json {manifest.get('version')!r}. "
                  "Bump both files and attach a new MCPB before re-running."
              )
          identifier = server["packages"][0]["identifier"]
          if f"/{tag}/" not in identifier:
              raise SystemExit(
                  f"server.json package identifier {identifier!r} does not contain /{tag}/"
              )
          print(f"registry metadata {version} matches {tag}")
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
