name: Publish to PyPI + MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install build && pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Check tag matches package version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PY=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$TAG" = "$PY"
          jq --arg v "$TAG" '.version = $v | .packages |= map(if has("version") then .version = $v else . end)' server.json > server.tmp
          mv server.tmp server.json

      - name: Build
        run: python -m build

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
