name: Publish to PyPI

# Publishes sonicmatch-mcp when a tag vX.Y.Z is pushed and X.Y.Z matches
# pyproject.toml. Authentication is PyPI Trusted Publishing (GitHub OIDC).
# There is no API token in this repository.
#
# One-time setup the maintainer must do before the first tag: PUBLISH.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Require the tag to match the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag {tag!r} must look like vX.Y.Z")
          version = tag[1:]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = pyproject["project"]["version"]
          init = Path("src/sonicmatch/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', init, re.M)
          bundled = match.group(1) if match else ""
          if not (version == declared == bundled):
              raise SystemExit(
                  f"refusing to build: tag {version!r}, "
                  f"pyproject {declared!r}, __version__ {bundled!r}"
              )
          print(f"version {version} matches")
          PY
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sonicmatch-mcp/
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
